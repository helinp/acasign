services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-signature}
      POSTGRES_USER: ${DB_USERNAME:-signature}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes:
      - /srv/docker/signature/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-signature} -d ${DB_DATABASE:-signature}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: [no-new-privileges:true]

  dss:
    # DSS (Digital Signature Service, Commission européenne) : construit la signature PAdES
    # à partir de la signature eID réalisée sur le poste. Premier build long (Maven, ~10-20 min).
    build: ./docker/dss
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g"
      # Service d'horodatage (RFC 3161) utilisé pour les signatures PAdES_BASELINE_T / LT.
      TSA_URL: ${TSA_URL:-http://tsa.belgium.be/connect}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    # backend : joignable par l'application uniquement ; egress : accès sortant (OCSP, CRL, AIA, horodatage).
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]

  migrate:
    build: .
    command: ["php", "artisan", "migrate", "--force"]
    env_file: .env
    depends_on:
      database: { condition: service_healthy }
    volumes: &app_volumes
      - /srv/docker/signature/data:/var/www/html/storage/app/private
      - /srv/docker/signature/logs:/var/www/html/storage/logs
    secrets: &app_secrets [pdf_signing_certificate, pdf_signing_private_key]
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: *app_volumes
    secrets: *app_secrets
    networks: [backend, proxy, egress]
    read_only: true
    tmpfs: [/tmp, "/var/www/html/storage/framework/cache:uid=33,gid=33,mode=0700", "/var/www/html/storage/framework/sessions:uid=33,gid=33,mode=0700", "/var/www/html/storage/framework/views:uid=33,gid=33,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      - traefik.enable=true
      # Réseau partagé avec Traefik (le conteneur est aussi sur « backend »)
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      # HTTP → redirection HTTPS
      - traefik.http.routers.acasign-http.rule=Host(`${SIGNATURE_HOST}`)
      - traefik.http.routers.acasign-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}
      - traefik.http.routers.acasign-http.middlewares=acasign-redirect-https
      - traefik.http.middlewares.acasign-redirect-https.redirectscheme.scheme=https
      # HTTPS : certificat par défaut de Traefik (interne ou wildcard) ou resolver ACME
      # défini sur l'entrypoint (--entrypoints.websecure.http.tls.certresolver=…)
      - traefik.http.routers.acasign-https.rule=Host(`${SIGNATURE_HOST}`)
      - traefik.http.routers.acasign-https.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      - traefik.http.routers.acasign-https.tls=true
      - traefik.http.services.acasign.loadbalancer.server.port=8080

  worker:
    build: .
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=4", "--timeout=60"]
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: *app_volumes
    secrets: *app_secrets
    networks: [backend, egress]  # egress : envoi des e-mails (SMTP), webhooks Teams/Telegram/API
    read_only: true
    tmpfs: [/tmp, "/var/www/html/storage/framework/cache:uid=33,gid=33,mode=0700", "/var/www/html/storage/framework/views:uid=33,gid=33,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  scheduler:
    build: .
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: *app_volumes
    secrets: *app_secrets
    networks: [backend, egress]  # egress : envoi des e-mails (SMTP), webhooks Teams/Telegram/API
    read_only: true
    tmpfs: [/tmp, "/var/www/html/storage/framework/cache:uid=33,gid=33,mode=0700", "/var/www/html/storage/framework/views:uid=33,gid=33,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

secrets:
  pdf_signing_certificate:
    file: ./secrets/pdf-signing.crt
  pdf_signing_private_key:
    file: ./secrets/pdf-signing.key

networks:
  backend: { internal: true }
  egress: {}
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
